# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen && open EpubReader.xcodeproj`
name: EpubReader
options:
  bundleIdPrefix: app.epubreader
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  EpubExtractor:
    path: .

targets:
  EpubReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - package: EpubExtractor
        product: EpubExtractor
      - package: EpubExtractor
        product: ReadAloudCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EPUB Reader
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Read-Aloud keeps playing with the screen locked or the app in the background.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.epubreader.EpubReader
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
